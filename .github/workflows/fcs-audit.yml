
name: FCS 2026 Data Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit FCS games and players
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          KEY = os.environ.get("CFBD_API_KEY")
          BASE = "https://api.collegefootballdata.com"

          if not KEY:
              raise SystemExit("Missing CFBD_API_KEY")

          def fetch(path, params):
              url = BASE + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + KEY,
                      "Accept": "application/json"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("HTTP ERROR", e.code, path)
                  return None
              except Exception as e:
                  print("REQUEST ERROR", path, str(e))
                  return None

          games = fetch("/games", {
              "year": 2026,
              "classification": "fcs"
          })

          if not isinstance(games, list):
              raise SystemExit("FCS games request failed")

          teams = set()
          completed = []
          scoring_ready = []

          for g in games:
              for key in ("homeTeam", "awayTeam"):
                  if g.get(key):
                      teams.add(g[key])

              if (
                  g.get("completed") is True
                  and g.get("homePoints") is not None
                  and g.get("awayPoints") is not None
              ):
                  completed.append(g)

                  home = g.get("homeLineScores")
                  away = g.get("awayLineScores")

                  if (
                      isinstance(home, list)
                      and isinstance(away, list)
                      and len(home) >= 4
                      and len(away) >= 4
                      and all(
                          isinstance(x, (int, float))
                          for x in home[:4] + away[:4]
                      )
                  ):
                      scoring_ready.append(g)

          print("===== FCS COVERAGE =====")
          print("Games:", len(games))
          print("Unique teams:", len(teams))
          print("Completed games:", len(completed))
          print("Games with quarter scores:", len(scoring_ready))

          print("\n===== TARGET MATCHUP =====")

          targets = ["Florida A&M", "Alabama State"]
          target_games = []

          for team in targets:
              matches = [
                  g for g in games
                  if team in (
                      g.get("homeTeam"),
                      g.get("awayTeam")
                  )
              ]

              print("\nTEAM:", team)
              print("Games discovered:", len(matches))

              for g in sorted(
                  matches,
                  key=lambda x: x.get("startDate") or ""
              ):
                  print(
                      g.get("startDate"),
                      g.get("awayTeam"),
                      g.get("awayPoints"),
                      "@",
                      g.get("homeTeam"),
                      g.get("homePoints"),
                      "Completed:", g.get("completed")
                  )

                  if g.get("completed") is True:
                      target_games.append(g)

                      home = g.get("homeLineScores")
                      away = g.get("awayLineScores")

                      if home and away:
                          print(
                              "  QUARTERS:",
                              "Away", away,
                              "Home", home
                          )
                          print(
                              "  FIRST HALF:",
                              "Away", sum(away[:2]),
                              "Home", sum(home[:2])
                          )

          print("\n===== PLAYER DATA TEST =====")

          sample = []
          seen = set()

          for g in target_games + completed:
              gid = g.get("id")
              if gid and gid not in seen:
                  seen.add(gid)
                  sample.append(g)
              if len(sample) >= 10:
                  break

          success = 0
          nonempty = 0
          failures = 0

          for g in sample:
              gid = g["id"]
              data = fetch("/games/players", {"id": gid})

              if isinstance(data, list):
                  success += 1
                  if data:
                      nonempty += 1

                  print(
                      "Game", gid,
                      "Player team records:", len(data)
                  )

                  if data:
                      print(
                          "Sample player response structure:",
                          json.dumps(data[0], indent=2)[:3500]
                      )
              else:
                  failures += 1

          print("\n===== FINAL AUDIT =====")
          print("Teams:", len(teams))
          print("Games:", len(games))
          print("Completed:", len(completed))
          print("Quarter scoring:", len(scoring_ready))
          print("Player requests successful:", success)
          print("Player requests nonempty:", nonempty)
          print("Player requests failed:", failures)

          if not completed:
              raise SystemExit(
                  "AUDIT FAILED: No completed games recognized"
              )

          if not scoring_ready:
              raise SystemExit(
                  "AUDIT FAILED: No quarter scoring found"
              )

          print("GAME DATA AUDIT PASSED")
          print("Player coverage still requires review")
          PY
